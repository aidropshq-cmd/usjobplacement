# Render blueprint. Root Directory must be `backend` on the service.
services:
  - type: web
    name: usjobplacement-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Set these in the Render dashboard — never commit them.
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://usjobplacement.zapkitt.com
      - key: NOTIFY_TEAM_EMAILS
        sync: false
      - key: SITE_URL
        value: https://usjobplacement.zapkitt.com
